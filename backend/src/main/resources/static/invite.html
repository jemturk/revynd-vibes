<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVYND - You've Been Invited!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --text-color: #F8FAFC;
            --subtext-color: #94A3B8;
            --primary-color: #FB923C;
            --primary-gradient: linear-gradient(135deg, #FB923C 0%, #F97316 100%);
            --accent-color: #0D9488;
            --border-color: #334155;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--subtext-color);
            margin: 0 0 30px 0;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        p {
            color: var(--subtext-color);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            box-sizing: border-box;
            margin-bottom: 12px;
            transition: transform 0.2s, opacity 0.2s;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #FFFFFF;
            border: none;
            box-shadow: 0 4px 14px 0 rgba(251, 146, 60, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--subtext-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="logo">REVYND</h1>
            <p class="tagline">Check the session. Boost the vibe.</p>

            <h2>You've Been Invited!</h2>
            <p>
                Your friend wants you to join them on REVYND to check real-time spot crowd density, log vibe checks, and sync up!
            </p>

            <!-- Action Buttons -->
            <a id="open-app-btn" href="#" class="btn btn-primary">Open in REVYND App</a>
            <a href="https://play.google.com/store" class="btn btn-secondary">Get it on Google Play</a>

            <div class="footer">
                <p>&copy; 2026 Revynd. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script>
        // Parse referrerId from query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('referrerId');
        
        // Construct deep link URL
        const appSchemeUrl = `revynd://invite?referrerId=${referrerId || ''}`;
        
        // Update the button link
        const openAppBtn = document.getElementById('open-app-btn');
        openAppBtn.href = appSchemeUrl;

        // Auto-redirect if referrerId is present
        if (referrerId) {
            // We set a small timeout to let the page load first
            setTimeout(() => {
                window.location.href = appSchemeUrl;
            }, 500);
        }
    </script>
</body>
</html>
