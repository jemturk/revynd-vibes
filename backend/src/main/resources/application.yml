spring:
  application:
    name: vibe-app
  
  datasource:
    # Pointing to the Docker container we'll spin up
    url: jdbc:postgresql://localhost:5432/revynd
    username: jem
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        # Crucial for PostGIS support in Hibernate 6
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Creates/Updates tables based on your Java Entities
      ddl-auto: update
    show-sql: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.resend.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:resend}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}
    from-name: ${MAIL_FROM_NAME:REVYND}