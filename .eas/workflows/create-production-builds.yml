name: Create Production Builds
on:
  push:
    branches:
      - main

jobs:
  build_android:
    type: build # This job type creates a production build for Android
    params:
      platform: android
      profile: production

  submit_android:
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production